name: Release

# Builds the HACS asset when a GitHub release is published:
#  1. vendors pybpost/ into custom_components/my_bpost/pybpost/
#     (the generic x-api-key is embedded in source)
#  2. checks manifest.json version matches the release tag
#  3. uploads bpost.zip to the release
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Vendor pybpost
        run: |
          cp -r pybpost/pybpost custom_components/my_bpost/pybpost
          find custom_components -name __pycache__ -type d -exec rm -rf {} + 2>/dev/null || true

      - name: Check embedded x-api-key
        run: |
          python3 - <<'EOF'
          import re
          text = open("custom_components/my_bpost/pybpost/const.py").read()
          assert "REPLACE_ME" not in text, "placeholder key in release!"
          key = re.search(r'X_API_KEY = "([^"]+)"', text).group(1)
          assert len(key) == 40, f"unexpected key length: {len(key)}"
          print("embedded key OK")
          EOF

      - name: Check manifest version matches tag
        run: |
          python3 - <<'EOF'
          import json, os
          tag = os.environ["TAG"].lstrip("v")
          manifest = json.load(open("custom_components/my_bpost/manifest.json"))
          assert manifest["version"] == tag, (
              f"manifest {manifest['version']} != tag {tag}")
          print(f"version {tag} OK")
          EOF
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: Build bpost.zip
        run: |
          rm -rf dist && mkdir dist
          cp -r custom_components dist/
          cd dist && zip -qr ../bpost.zip custom_components
          cd .. && unzip -l bpost.zip | head -20

      - name: Upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} bpost.zip --clobber
