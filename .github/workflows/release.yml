name: Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build self-contained HACS archive
        run: python3 scripts/build_release.py --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - name: Install Home Assistant test dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Test installation and migration from this archive
        run: python3 -m unittest discover -s tests/ha -v
        env:
          BPOST_RELEASE_ZIP: ${{ github.workspace }}/bpost.zip
      - name: Upload validated asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" bpost.zip blueprints/automation/my_bpost/*.yaml --clobber
