name: Validate

on: [push, pull_request]

jobs:
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Syntax check
        run: python3 -m compileall -q custom_components pybpost scripts tests
      - name: Install client
        run: python3 -m pip install -e ./pybpost --config-settings editable_mode=compat
      - name: Client and packaging tests
        run: python3 -m unittest discover -s tests -v
      - name: Build HACS archive
        run: python3 scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: bpost-release
          path: bpost.zip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Card rendering and interaction tests
        run: node --test tests/frontend/*.test.cjs

  integration:
    needs: packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Home Assistant test dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - uses: actions/download-artifact@v4
        with:
          name: bpost-release
      - name: Integration and archive installation tests
        run: python3 -m unittest discover -s tests/ha -v
        env:
          BPOST_RELEASE_ZIP: ${{ github.workspace }}/bpost.zip

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          comment: false

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
