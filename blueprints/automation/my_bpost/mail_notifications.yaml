blueprint:
  name: My bpost · New-letter notifications
  description: Account-specific Companion app notifications. Existing inbox imports are silent. Repeated updates
    replace the notification for the same parcel or letter. No scans or signed image links are attached.
  domain: automation
  homeassistant:
    min_version: 2026.2.3
  input:
    account_device:
      name: My bpost account
      description: Choose an account device; manual public parcels do not provide letters. Requires My bpost 0.6.0 or newer.
      selector:
        device:
          filter:
          - integration: my_bpost
    notify_device:
      name: Phone or tablet
      description: A device registered with the Home Assistant Companion app.
      selector:
        device:
          filter:
          - integration: mobile_app
    language:
      name: Notification language
      default: fr
      selector:
        select:
          options:
          - value: fr
            label: Français
          - value: en
            label: English
          - value: nl
            label: Nederlands
          - value: de
            label: Deutsch
    quiet_enabled:
      name: Enable quiet hours
      description: Notifications during this period are skipped, not delayed. Uses the Home Assistant time zone.
        Equal start/end times disable the quiet period.
      default: false
      selector:
        boolean: {}
    quiet_start:
      name: Quiet hours start
      default: '22:00:00'
      selector:
        time: {}
    quiet_end:
      name: Quiet hours end
      default: 07:00:00
      selector:
        time: {}
    dashboard_path:
      name: Dashboard to open
      description: Home Assistant path opened when tapping the notification, for example /lovelace/deliveries.
      default: /lovelace
      selector:
        text: {}
mode: queued
max: 20
max_exceeded: warning
variables:
  account_device: !input 'account_device'
  language: !input 'language'
  quiet_enabled: !input 'quiet_enabled'
  quiet_start: !input 'quiet_start'
  quiet_end: !input 'quiet_end'
triggers:
- trigger: event
  event_type: my_bpost_letter_announced
conditions:
- condition: template
  value_template: |-
    {{ trigger is defined and trigger.platform == 'event'
       and trigger.event.data.get('entry_id') in
       ((device_attr(account_device, 'identifiers') or [])
        | selectattr(0, 'eq', 'my_bpost') | map(attribute=1) | list) }}
- condition: template
  value_template: |-
    {% if not quiet_enabled %}
      {{ true }}
    {% else %}
      {% set start = today_at(quiet_start) %}
      {% set end = today_at(quiet_end) %}
      {% set current = now() %}
      {{ start == end or not
         ((start <= current < end) if start < end else
          (current >= start or current < end)) }}
    {% endif %}
- condition: template
  value_template: '{{ trigger.event.data.get(''mail_id'', '''') | length > 0 }}'
actions:
- device_id: !input 'notify_device'
  domain: mobile_app
  type: notify
  title: My bpost
  message: '{{ {''fr'':''Un nouveau courrier est annoncé.'', ''en'':''A new letter was announced.'', ''nl'':''Een
    nieuwe brief is aangekondigd.'', ''de'':''Ein neuer Brief wurde angekündigt.''}.get(language, ''A new letter
    was announced.'') }}'
  data:
    tag: my-bpost-{{ trigger.event.data['entry_id'] }}-{{ trigger.event.data['mail_id'] }}
    url: !input 'dashboard_path'
    clickAction: !input 'dashboard_path'
